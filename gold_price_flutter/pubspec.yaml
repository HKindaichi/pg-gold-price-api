name: gold_price_flutter
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.5+6

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  http: ^1.2.0
  html: ^0.15.4
  fl_chart: ^1.1.1
  provider: ^6.1.1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  uuid: ^4.3.3
  url_launcher: ^6.2.5
  csv: ^6.0.0
  google_fonts: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_app_logo"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/history.csv
