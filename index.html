<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Price Tracker</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gold: #fbbf24;
            --accent-gold-glow: rgba(251, 191, 36, 0.2);
            --chart-line: #fbbf24;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
        }

        h1 {
            font-weight: 600;
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #fde68a, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 20px var(--accent-gold-glow);
        }

        .subtitle {
            color: var(--text-secondary);
            margin-top: 10px;
            font-size: 1.1rem;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 30px;
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        .latest-price {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .price-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 20px;
            min-width: 150px;
            text-align: center;
            border: 1px solid rgba(251, 191, 36, 0.1);
        }

        .price-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .price-value {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--accent-gold);
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: var(--text-secondary);
        }

        footer {
            margin-top: auto;
            color: var(--text-secondary);
            font-size: 0.8rem;
            text-align: center;
            padding-top: 20px;
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .chart-container { height: 300px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Gold Price Tracker</h1>
            <div class="subtitle">Live data from Public Gold & MIGA-i</div>
        </header>

        <div id="loading" class="loading">Loading data...</div>

        <div id="dashboard" style="display: none;">
            <div class="latest-price">
                <div class="price-item">
                    <div class="price-label">PG Sell (999)</div>
                    <div class="price-value" id="latest-sell">-</div>
                </div>
                <div class="price-item">
                    <div class="price-label">PG Buy (999)</div>
                    <div class="price-value" id="latest-buy">-</div>
                </div>
            </div>

            <div class="card">
                <div class="chart-container">
                    <canvas id="goldChart"></canvas>
                </div>
            </div>
        </div>

        <footer>
            Updated automatically every 6 hours.
        </footer>
    </div>

    <script>
        const CSV_URL = 'output/history.csv';

        async function fetchData() {
            try {
                const response = await fetch(CSV_URL);
                if (!response.ok) throw new Error("Network response was not ok");
                const csvText = await response.text();
                
                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    complete: function(results) {
                        processData(results.data);
                    },
                    error: function(err) {
                        console.error("CSV Parse Error:", err);
                        showError("Failed to parse data.");
                    }
                });
            } catch (error) {
                console.error("Fetch Error:", error);
                // Fallback for demo purposes if file doesn't exist yet
                showError("No history data found yet. Wait for the first scheduled run!");
            }
        }

        function showError(msg) {
            document.getElementById('loading').innerText = msg;
        }

        function processData(data) {
            // Filter for Public Gold 999 for now
            const pg999 = data.filter(row => row.merchant === 'public_gold' && row.item === '999');
            
            if (pg999.length === 0) {
                showError("No Public Gold (999) data available.");
                return;
            }

            // Sort by timestamp
            pg999.sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            // Prepare Chart Data
            const labels = pg999.map(row => {
                const date = new Date(row.timestamp);
                return date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
            });
            const sellPrices = pg999.map(row => parseFloat(row.sell));
            const buyPrices = pg999.map(row => parseFloat(row.buy));

            // Update Latest Display
            const latest = pg999[pg999.length - 1];
            document.getElementById('latest-sell').innerText = `RM ${latest.sell}`;
            document.getElementById('latest-buy').innerText = `RM ${latest.buy}`;

            renderChart(labels, sellPrices, buyPrices);
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        }

        function renderChart(labels, sellData, buyData) {
            const ctx = document.getElementById('goldChart').getContext('2d');
            
            // Gradient for line
            const gradientSell = ctx.createLinearGradient(0, 0, 0, 400);
            gradientSell.addColorStop(0, 'rgba(251, 191, 36, 0.5)');
            gradientSell.addColorStop(1, 'rgba(251, 191, 36, 0.0)');

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Sell Price (RM/g)',
                            data: sellData,
                            borderColor: '#fbbf24',
                            backgroundColor: gradientSell,
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 4,
                            pointBackgroundColor: '#fbbf24'
                        },
                        {
                            label: 'Buy Price (RM/g)',
                            data: buyData,
                            borderColor: '#94a3b8',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            fill: false,
                            tension: 0.4,
                            pointRadius: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        intersect: false,
                        mode: 'index',
                    },
                    plugins: {
                        legend: {
                            labels: { color: '#cbd5e1' }
                        },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#fbbf24',
                            bodyColor: '#f8fafc',
                            borderColor: 'rgba(255,255,255,0.1)',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                        }
                    },
                    scales: {
                        x: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#64748b' }
                        },
                        y: {
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#64748b' }
                        }
                    }
                }
            });
        }

        // Start
        fetchData();
    </script>
</body>
</html>
